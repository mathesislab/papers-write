[package]
name = "papers-write"
version = "0.2.0"
description = "Write papers in plain text: Markdown and LaTeX, cited from the papers library, built with texmark"
authors = ["Alexander Robinson"]
edition = "2024"
license = "MIT"

[lib]
# the `_lib` suffix keeps the name of the library apart from the binary's (Windows)
name = "papers_write_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# the app's state.json (the project bar, the recent projects)
serde_json = "1"
notify = "8"
tauri-plugin-opener = "2"
# a PDF in PDFKit, as papers-review shows them
tauri-plugin-pdfkit = { git = "https://github.com/mathesislab/tauri-plugin-pdfkit", tag = "v0.4.0" }
papers-write-core = { version = "0.1.0", path = "../crates/core" }
# the .bib files watched (papers-core, as papers-write-core has it)
papers-core = { git = "https://github.com/mathesislab/papers-desktop", tag = "v0.9.0" }

# the windows as tabs whatever the system's setting (NSWindow addTabbedWindow), as Papers Desktop uses AppKit
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder", "NSGraphics", "NSApplication"] }
# the Trash (as papers-review moves files there); already in the lock through objc2-app-kit
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError", "NSUserDefaults"] }
